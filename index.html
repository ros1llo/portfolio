    <script>
  (function () {
    try {
      var tema = localStorage.getItem("theme");
      document.documentElement.dataset.theme = tema === "dark" ? "dark" : "light";
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  })();
</script>
